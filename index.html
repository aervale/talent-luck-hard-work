}
*{border-radius:0!important;box-sizing:border-box}
[hidden]{display:none!important}
html{background:#0b0a0d}
body{background:linear-gradient(180deg,#0b0a0d 0%,#100d12 40%,#161118 75%,#1a1319 100%);min-height:100vh;color:var(--fg);font:15.5px/1.55 var(--f-body);position:relative;overflow-x:hidden}

  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 38%,rgba(0,0,0,.45) 62%,rgba(0,0,0,.12) 82%,transparent 100%);
          mask-image:linear-gradient(to bottom,#000 0%,#000 38%,rgba(0,0,0,.45) 62%,rgba(0,0,0,.12) 82%,transparent 100%)}
.bgart canvas{width:100%;height:100%;display:block;opacity:.32}
.bgart::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,13,.55) 0%,rgba(11,10,13,.25) 40%,rgba(11,10,13,0) 70%)}
.range{display:flex;align-items:center;gap:12px;min-width:0}

.tools{display:flex}
.btn{font:15px var(--f-body);background:var(--panel);color:var(--fg);border:1px solid var(--fg);min-width:34px;height:30px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tools .btn+.btn{border-left-width:0}

.settings{position:absolute;top:100%;right:-1px;z-index:5;width:min(700px,calc(100% + 2px));max-height:min(78vh,720px);overflow-y:auto;background:rgba(27,24,30,.72);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);border:1px solid var(--fg);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:14px;display:grid;gap:12px}

.stage{position:relative;height:clamp(340px,min(64vh,105vw),640px);touch-action:none}

.settings{top:100%;right:0;width:min(360px,100%);height:clamp(340px,min(64vh,105vw),640px);max-height:none;border-width:0 0 0 1px;box-shadow:-10px 0 24px rgba(0,0,0,.3);align-content:start;gap:14px;padding:16px 14px}

<script>
// hard work, talent, luck, source (0 = my other notes, 1 = AI safety incl. EAG, 2 = dormspam survey), anonymous.
// Notes rows add: MIT (1/0). Dormspam rows are all MIT.

const S3=Math.sqrt(3)/2;
const triXY=(h,t,l)=>[l+h/2,h*S3];            // side 100: talent (0,0), luck (100,0), hard work (50,86.6)
const fmt=v=>Number.isInteger(v)?String(v):String(Math.round(v*10)/10);

(function nudge(){const a=1.7,D=[[2,-1,-1],[-1,2,-1],[-1,-1,2],[-2,1,1],[1,-2,1],[1,1,-2],[a,-a,0],[-a,a,0],[a,0,-a],[-a,0,a],[0,a,-a],[0,-a,a]],S=0.33,g={};
 P.forEach(p=>{const k=p.v.map(x=>x.toFixed(2)).join('/');(g[k]=g[k]||[]).push(p)});
 Object.values(g).forEach(grp=>grp.forEach((p,i)=>{if(grp.length<2){p.pos=p.v.slice();return}
  const ok=D.filter(d=>d.every((c,j)=>p.v[j]+S*c>=0)),d=ok[i%ok.length],m=S*(1+Math.floor(i/ok.length));p.pos=p.v.map((x,j)=>x+m*d[j])}))})();

const fixSlot=s=>{if(!s)return s;if(!({all:1,eag:1,other:1,dorm:1})[s.grp])s.grp='all';if(!({any:1,mit:1,non:1})[s.sch])s.sch='any';if(!({tri:1,sc3:1,wm:1,heat:1})[s.view])s.view='tri';if(!s.f||typeof s.f!=='object')s.f={yr:-1,rg:-1,mj:-1,tags:0};return s};
slots.forEach(fixSlot);if(!slots[1]){UI.cmp=false;UI.act=0}if(!UI.cmp)UI.act=0;

const fMatch=p=>(state.f.yr<0||p.yr===state.f.yr)&&(state.f.rg<0||p.rg===state.f.rg)&&(state.f.mj<0||(p.mb>>state.f.mj&1))&&((p.tb&state.f.tags)===state.f.tags);
const schOK=p=>state.sch==='any'||(state.sch==='mit')===!!p.mit;
const sel=()=>P.filter(p=>(state.grp==='all'||p.g===state.grp)&&(!fActive()||fMatch(p))&&schOK(p));
function fDesc(){const d=[];if(state.f.yr>=0)d.push(['freshmen','sophomores','juniors','seniors'][state.f.yr]);if(state.f.rg>=0)d.push(REGIONS[state.f.rg]);if(state.f.mj>=0)d.push(MAJORS[state.f.mj].replace(/ \(.*\)/,''));TAGS.forEach((t,k)=>{if(state.f.tags>>k&1)d.push(t.toLowerCase())});return d.join(', ')}
const schLabel=()=>state.sch==='mit'?', MIT':state.sch==='non'?', not MIT':'';
const grpLabel=()=>(state.grp==='all'?'everyone':GL[state.grp])+(fActive()?': '+fDesc():'')+schLabel();

function geomed(pts){if(!pts.length)return[0,0,0];let x=[0,1,2].map(i=>pts.reduce((s,p)=>s+p.v[i],0)/pts.length);
 for(let it=0;it<1500;it++){let W=0;const n=[0,0,0];for(const p of pts){const w=1/Math.max(Math.hypot(p.v[0]-x[0],p.v[1]-x[1],p.v[2]-x[2]),1e-9);W+=w;for(let i=0;i<3;i++)n[i]+=w*p.v[i]}x=n.map(v=>v/W)}return x}

function hex2rgb(h){h=(h||'').trim();if(h[0]==='#'){if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}const m=h.match(/[\d.]+/g);return m?m.slice(0,3).map(Number):[128,128,128]}
function C(){const s=getComputedStyle(document.documentElement),g=k=>s.getPropertyValue(k).trim();
 const c={},res=v=>{const m=v.match(/^var\((--[\w-]+)\)$/);return m?res(g(m[1])):v};['bg','panel','fg','muted','line','work','talent','luck','tie','star','lo','mid','hi'].forEach(k=>c[k]=res(g('--'+k)));c.mono=g('--f-mono');c.body=g('--f-body');
 c.ramp=[c.lo,c.mid,c.hi].map(hex2rgb);return c}
const rgbs=(a,f=1,al=1)=>`rgba(${a.map(v=>Math.round(Math.max(0,Math.min(255,v*f)))).join(',')},${al})`;
function ramp(stops,t){t=Math.max(0,Math.min(1,t));const n=stops.length-1,i=Math.min(n-1,Math.floor(t*n)),u=t*n-i;return stops[i].map((v,k)=>v+(stops[i+1][k]-v)*u)}
